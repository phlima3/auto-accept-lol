name: Build & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auto_accept.py"
      - "requirements.txt"
      - "tray_icon.png"
      - "icon.ico"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build .exe
        run: >
          pyinstaller
          --onefile
          --noconsole
          --name "AutoAcceptLoL"
          --icon=icon.ico
          --add-data "tray_icon.png;."
          auto_accept.py

      - name: Update release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset Executable AutoAcceptLoL.exe --yes || true
          gh release upload Executable dist/AutoAcceptLoL.exe --clobber
